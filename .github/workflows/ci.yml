name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-gamebuilder ./cmd/pocket-gamebuilder
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pgb DEMO_DATA=true AUTH_MODE=none ./pocket-gamebuilder &
          sleep 4
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/games | grep -q "Kitty's Big Jump"
          curl -fsS http://localhost:8080/api/v1/summary | grep -q '"plays_this_week"'
          curl -fsS http://localhost:8080/api/v1/templates | grep -q '"platformer"'
          curl -fsS 'http://localhost:8080/api/v1/search?q=ghost' | grep -q 'Ghost Castle'
          curl -fsS http://localhost:8080/api/v1/assets | grep -q 'Robot'
          curl -fsS http://localhost:8080/api/v1/public/demo424200 | grep -q "Kitty's Big Jump"
          curl -fsS http://localhost:8080/p/demo424200 | grep -q 'player.js'
          curl -fsS http://localhost:8080/api/v1/games/1/export.html | grep -q '__GAME__'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-gamebuilder:pr
