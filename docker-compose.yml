# Pocket Game Builder (Go + SQLite) — make your own small games without code, play them and share a link anyone can play.
services:
  pocket-gamebuilder:
    image: ghcr.io/abjelosevic88/pocket-homelab-game-builder:latest
    container_name: pocket-gamebuilder
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # MAX_UPLOAD_BYTES: "67108864"   # the biggest picture, sound or music file (64 MB)
      # Pocket Core: one sign-in, Pocket AI, and app links to Pocket Photos, Files, Draw, Photo Lab, Music, Voice,
      # Translate, Puzzlecraft, Blog, Chat, Forum, Email, Contacts, Tasks, Projects, Notes, Calendar, Family and Alerts.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
